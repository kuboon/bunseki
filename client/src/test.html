<!DOCTYPE html>
<html>
  <head>
    <script>
      const e = [], p = e.push.bind(e);
      addEventListener("error", p, true);
      addEventListener("unhandledrejection", p);
      window.getStartupErrors = () => {
        removeEventListener("error", p, true);
        removeEventListener("unhandledrejection", p);
        return e;
      };
    </script>
    <script type="module">
      import { span } from "/exporter.browser.js";
      await Promise.all(window.getStartupErrors().map(e => {
        span.recordException(e instanceof PromiseRejectionEvent ? e.reason : e);
      }));
      span.
    </script>
  </head>
  <body>
    <h1>Test</h1>
    <script type="module">
      hoge();
      await new Promise((_, reject) =>
        reject(new Error("Promise error"))
      );
    </script>
  </body>
</html>
